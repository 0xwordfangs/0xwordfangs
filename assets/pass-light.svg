.nfc path,.node{animation:none}
}
@keyframes sweep{0%{opacity:1;transform:translateX(-260px)}24%{opacity:1;transform:translateX(1040px)}24.01%,100%{opacity:0;transform:translateX(1040px)}}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.5);opacity:0}}
@keyframes nfc{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes nodepulse{0%,20%,100%{stroke-width:1.5;stroke-opacity:1}10%{stroke-width:6;stroke-opacity:.35}}
