.nfc path:nth-child(2){animation-delay:.25s}.nfc path:nth-child(3){animation-delay:.5s}
.node{animation:nodepulse 10s ease-in-out infinite}
.n1{animation-delay:0s}.n2{animation-delay:2s}.n3{animation-delay:4s}.n4{animation-delay:6s}.n5{animation-delay:8s}
}
@media (prefers-reduced-motion:reduce){
